name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: npx playwright install --with-deps chromium
      - run: pnpm vitest run
      - run: pnpm build
      # End-to-end specs run against the build/ produced above (E2E_PREBUILT makes
      # the Playwright web server a plain `vite preview` instead of a second build).
      - run: pnpm exec playwright test --pass-with-no-tests
        env:
          E2E_PREBUILT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
